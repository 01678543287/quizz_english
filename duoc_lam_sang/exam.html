<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF6EE" />
    <title>Kiểm tra Dược Lâm Sàng</title>
    <link rel="stylesheet" href="../shared/style.css">
    <link rel="stylesheet" href="../shared/mobile.css">
</head>

<body class="exam-page">
    <header class="app-bar">
        <a class="icon-btn" href="../shared/menu.html" aria-label="Về menu">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 12H5" />
                <path d="m12 19-7-7 7-7" />
            </svg>
        </a>
        <div class="app-bar-title">Kiểm tra · Dược Lâm Sàng</div>
        <div class="app-bar-count">Trang <span id="exam-page-num">1</span>/<span id="exam-page-total">2</span></div>
        <div class="progress-track" role="progressbar" aria-label="Tiến độ trang kiểm tra" aria-valuemin="1" aria-valuemax="2" aria-valuenow="1">
            <div id="exam-progress-fill" class="progress-fill"></div>
        </div>
    </header>

    <div class="exam-head">
        <div class="exam-toolbar">
            <a class="toolbar-exam" href="index.html">Về luyện tập</a>
            <button class="toolbar-shuffle" type="button" onclick="createNewExam()">Tạo đề mới</button>
        </div>
    </div>

    <div class="exam-coverage" aria-live="polite">
        <div class="coverage-row">
            <span id="coverage-cycle">Đang tải…</span>
            <span id="coverage-hint"></span>
        </div>
        <div class="coverage-track" aria-hidden="true"><div id="coverage-fill"></div></div>
        <div id="coverage-count" class="coverage-count">Đang tính độ phủ…</div>
    </div>

    <div id="main-layout">
        <div id="quiz-container"></div>
    </div>

    <div id="exam-sheet-backdrop" class="sheet-backdrop" hidden></div>
    <section id="exam-sheet" class="sheet exam-sheet" role="dialog" aria-modal="true" aria-labelledby="exam-sheet-title" tabindex="-1" hidden>
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="sheet-head">
            <h2 id="exam-sheet-title">Danh sách câu</h2>
            <button id="exam-sheet-close" class="icon-btn" type="button" aria-label="Đóng danh sách câu">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M18 6 6 18" />
                    <path d="m6 6 12 12" />
                </svg>
            </button>
        </div>
        <aside id="sidebar"></aside>
    </section>

    <nav class="bottom-bar exam-bottom" aria-label="Điều hướng trang kiểm tra">
        <button id="exam-prev" class="btn-ghost" type="button">Trước</button>
        <button id="exam-sheet-btn" class="btn-pill" type="button">Danh sách câu</button>
        <button id="exam-next" class="btn-primary" type="button">Sau</button>
    </nav>

    <button id="back-to-top" class="back-to-top" type="button" aria-label="Lên đầu trang" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m18 15-6-6-6 6" />
        </svg>
    </button>

    <script src="quiz_data.js"></script>
    <script>
        function createNewExam() {
            localStorage.removeItem('quiz_exam_indexes_dls_v1');
            localStorage.removeItem('quiz_exam_shuffled_options_dls_v1');
            localStorage.removeItem('quiz_exam_answers_dls_v1');
            window.location.reload();
        }
    </script>
    <script src="exam.js"></script>
    <script src="../shared/exam-mobile.js"></script>
    <script src="../shared/back-to-top.js"></script>
</body>

</html>
