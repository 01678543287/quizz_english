<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF6EE" />
    <title>Quiz Dược Lâm Sàng</title>
    <link rel="stylesheet" href="../shared/style.css">
    <link rel="stylesheet" href="../shared/mobile.css">
</head>

<body class="practice-page">
    <header class="app-bar">
        <a class="icon-btn" href="../shared/menu.html" aria-label="Về menu">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 12H5" />
                <path d="m12 19-7-7 7-7" />
            </svg>
        </a>
        <div class="app-bar-title">Dược Lâm Sàng</div>
        <div class="app-bar-count">Trang <span id="current-num">1</span>/<span id="total-num">16</span></div>
        <button id="reset-top-btn" class="icon-btn" type="button" aria-label="Reset kết quả">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
                <path d="M3 3v5h5" />
            </svg>
        </button>
        <div class="progress-track" role="progressbar" aria-label="Tiến độ trang" aria-valuemin="1" aria-valuemax="16" aria-valuenow="1">
            <div id="progress-fill" class="progress-fill"></div>
        </div>
    </header>

    <main class="practice-main">
        <div class="practice-toolbar">
            <a class="toolbar-exam" href="exam.html">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2" />
                    <rect x="9" y="3" width="6" height="4" rx="1" />
                    <path d="m9 14 2 2 4-4" />
                </svg>
                Làm kiểm tra 40 câu
            </a>
        </div>
        <div id="question-card"></div>
        <div class="practice-actions">
            <a class="action-link" href="exam.html">Làm kiểm tra 40 câu</a>
            <button id="reset-inline-btn" class="action-danger" type="button">Reset kết quả</button>
        </div>
    </main>

    <aside id="desktop-sidebar" class="desktop-sidebar" aria-label="Danh sách câu">
        <h2 class="sidebar-heading">Danh sách câu</h2>
        <div id="desktop-grid" class="sheet-grid"></div>
    </aside>

    <p id="live-region" class="visually-hidden" aria-live="polite"></p>

    <nav class="bottom-bar" aria-label="Điều hướng câu hỏi">
        <button id="prev-btn" class="btn-ghost" type="button">Trước</button>
        <button id="sheet-btn" class="btn-pill" type="button">Danh sách câu</button>
        <button id="next-btn" class="btn-primary" type="button">Sau</button>
    </nav>

    <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>

    <section id="question-sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1" hidden>
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="sheet-head">
            <h2 id="sheet-title">Danh sách câu</h2>
            <button id="sheet-close" class="icon-btn" type="button" aria-label="Đóng danh sách câu">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M18 6 6 18" />
                    <path d="m6 6 12 12" />
                </svg>
            </button>
        </div>
        <div id="sheet-grid" class="sheet-grid"></div>
        <div class="sheet-actions">
            <a class="btn-secondary" href="exam.html">Làm kiểm tra</a>
            <button id="reset-btn" class="btn-danger" type="button">Reset kết quả</button>
        </div>
    </section>

    <div id="reset-dialog-backdrop" class="dialog-backdrop" hidden></div>
    <section id="reset-dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="reset-dialog-title" tabindex="-1" hidden>
        <h2 id="reset-dialog-title">Reset kết quả?</h2>
        <p>Toàn bộ đáp án đã chọn sẽ bị xoá và thứ tự câu sẽ đảo lại.</p>
        <div class="dialog-actions">
            <button id="reset-cancel" class="btn-secondary" type="button">Huỷ</button>
            <button id="reset-confirm" class="btn-danger-solid" type="button">Reset</button>
        </div>
    </section>

    <script src="../shared/quiz-core.js"></script>
    <script src="quiz_data.js"></script>
    <script src="main.js"></script>
</body>

</html>
