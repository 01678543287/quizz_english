<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF6EE" />
    <title>Kiểm tra Pháp Chế Dược</title>
    <link rel="stylesheet" href="../shared/style.css">
    <link rel="stylesheet" href="../shared/mobile.css">
</head>

<body class="exam-page">
    <header class="app-bar">
        <a class="icon-btn" href="../shared/menu.html" aria-label="Về menu">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 12H5" />
                <path d="m12 19-7-7 7-7" />
            </svg>
        </a>
        <div class="app-bar-title">Kiểm tra · Pháp Chế Dược</div>
        <div class="app-bar-count">Trang <span id="exam-page-num">1</span>/<span id="exam-page-total">2</span></div>
        <div class="progress-track" role="progressbar" aria-label="Tiến độ trang kiểm tra" aria-valuemin="1" aria-valuemax="2" aria-valuenow="1">
            <div id="exam-progress-fill" class="progress-fill"></div>
        </div>
    </header>

    <div class="exam-head">
        <div class="exam-toolbar">
            <a class="toolbar-exam" href="index.html">Về luyện tập</a>
            <button id="exam-prev-exam" class="toolbar-shuffle" type="button" disabled>Đề trước</button>
            <button id="exam-next-exam" class="toolbar-shuffle" type="button" disabled>Đề sau</button>
        </div>
    </div>

    <div class="exam-coverage" aria-live="polite">
        <div class="coverage-row">
            <span id="coverage-cycle">Đang tải…</span>
            <span id="coverage-hint"></span>
        </div>
        <div class="coverage-track" aria-hidden="true"><div id="coverage-fill"></div></div>
        <div id="coverage-count" class="coverage-count">Đang tính độ phủ…</div>
    </div>

    <div id="main-layout">
        <div id="quiz-container"></div>
    </div>

    <div id="exam-sheet-backdrop" class="sheet-backdrop" hidden></div>
    <section id="exam-sheet" class="sheet exam-sheet" role="dialog" aria-modal="true" aria-labelledby="exam-sheet-title" tabindex="-1" hidden>
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="sheet-head">
            <h2 id="exam-sheet-title">Danh sách câu</h2>
            <button id="exam-sheet-close" class="icon-btn" type="button" aria-label="Đóng danh sách câu">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M18 6 6 18" />
                    <path d="m6 6 12 12" />
                </svg>
            </button>
        </div>
        <aside id="sidebar"></aside>
    </section>

    <div id="exam-reset-dialog-backdrop" class="dialog-backdrop" hidden></div>
    <section id="exam-reset-dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="exam-reset-dialog-title" tabindex="-1" hidden>
        <h2 id="exam-reset-dialog-title">Reset kết quả?</h2>
        <p>Toàn bộ đáp án đã chọn sẽ bị xoá. Bộ câu hỏi được giữ nguyên, phương án sẽ được xáo lại.</p>
        <div class="dialog-actions">
            <button id="exam-reset-cancel" class="btn-secondary" type="button">Huỷ</button>
            <button id="exam-reset-confirm" class="btn-danger-solid" type="button">Reset</button>
        </div>
    </section>

    <nav class="bottom-bar exam-bottom" aria-label="Điều hướng trang kiểm tra">
        <button id="exam-prev" class="btn-ghost" type="button">Trước</button>
        <button id="exam-sheet-btn" class="btn-pill" type="button">Danh sách câu</button>
        <button id="exam-next" class="btn-primary" type="button">Sau</button>
    </nav>

    <button id="back-to-top" class="back-to-top" type="button" aria-label="Lên đầu trang" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m18 15-6-6-6 6" />
        </svg>
    </button>

    <script src="quiz_data.js"></script>
    <script>
        window.EXAM_HISTORY_CONFIG = {
            indexes: 'quiz_exam_indexes_pcd_v1',
            options: 'quiz_exam_shuffled_options_pcd_v1',
            answers: 'quiz_exam_answers_pcd_v1',
            seen: 'quiz_exam_seen_pcd_v1',
            cycle: 'quiz_exam_cycle_pcd_v1',
            history: 'quiz_exam_history_pcd_v1',
            cursor: 'quiz_exam_history_cursor_pcd_v1',
            pending: 'quiz_exam_history_pending_pcd_v1'
        };
    </script>
    <script src="../shared/exam-history.js"></script>
    <script src="exam.js"></script>
    <script src="../shared/exam-mobile.js"></script>
    <script src="../shared/exam-reset-dialog.js"></script>
    <script src="../shared/back-to-top.js"></script>
</body>

</html>
