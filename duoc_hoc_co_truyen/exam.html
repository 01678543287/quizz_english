<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF6EE" />
    <title>Kiểm tra Dược Học Cổ Truyền</title>
    <link rel="stylesheet" href="../shared/style.css">
    <link rel="stylesheet" href="../shared/mobile.css">
</head>

<body class="exam-page">
    <header class="app-bar">
        <a class="icon-btn" href="../shared/menu.html" aria-label="Về menu">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 12H5" />
                <path d="m12 19-7-7 7-7" />
            </svg>
        </a>
        <div class="app-bar-title">Dược Học Cổ Truyền</div>
        <div class="app-bar-count">40 câu</div>
    </header>

    <div class="exam-head">
        <h1>Kiểm tra 40 câu ngẫu nhiên</h1>
        <div class="exam-actions">
            <a class="reset-btn" href="index.html">Về luyện tập</a>
            <button class="reset-btn" type="button" onclick="createNewExam()">Tạo đề mới</button>
        </div>
    </div>

    <div id="main-layout">
        <aside id="sidebar"></aside>
        <div id="quiz-container"></div>
    </div>

    <script src="quiz_data.js"></script>
    <script>
        function createNewExam() {
            localStorage.removeItem('quiz_exam_indexes_dhct_v1');
            localStorage.removeItem('quiz_exam_shuffled_options_dhct_v1');
            localStorage.removeItem('quiz_exam_answers_dhct_v1');
            window.location.reload();
        }
    </script>
    <script src="exam.js"></script>
    <script src="../shared/enhance-ux.js"></script>
</body>

</html>
