<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF6EE" />
    <title>Sổ Ôn Bài — Chọn môn</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="menu.css">
</head>

<body class="lobby-page">
    <main class="lobby">
        <header class="lobby-top">
            <div class="wordmark">Sổ Ôn Bài</div>
            <div class="lobby-tag">DƯỢC · <span id="subject-count">5</span> môn</div>
        </header>

        <section class="lobby-hero">
            <p class="eyebrow">HÔM NAY</p>
            <h1>Học <span class="hl">gì?</span></h1>
            <p class="hero-sub">Mỗi ngày một ít, đều hơn là dồn.</p>
        </section>

        <section id="continue-slot" aria-label="Tiếp tục học"></section>

        <section class="subject-section">
            <div class="section-head">
                <h2>Môn học</h2>
                <span id="progress-summary"></span>
            </div>
            <div id="subjects-list" class="subjects-list"></div>
        </section>

        <footer class="lobby-tip">
            <h3>Mẹo nhỏ</h3>
            <p>Làm 10 câu, đánh dấu câu sai, nghỉ 2 phút rồi quay lại. Đều đặn dễ hơn là dồn một buổi.</p>
        </footer>

        <p class="privacy">Dữ liệu lưu trên máy bạn.</p>

        <noscript>
            <p>Bật JavaScript để xem lobby. Các môn đang mở:
                <a href="../tieng-anh-2/index.html">Tiếng Anh 2</a>,
                <a href="../baoche-2/index.html">Bào Chế 2</a>,
                <a href="../duocly-2/index.html">Dược Lý 2</a>,
                <a href="../duoc_hoc_co_truyen/index.html">Dược Học Cổ Truyền</a>,
                <a href="../duoc_lam_sang/index.html">Dược Lâm Sàng</a>.
            </p>
        </noscript>
    </main>

    <script src="quiz-core.js"></script>
    <script src="subjects.js"></script>
    <script src="menu.js"></script>
</body>

</html>
